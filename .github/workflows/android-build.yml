name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: |
          mkdir -p www
          cp *.html *.css *.js *.json *.png www/ || true
          npx cap add android || true
          npx cap sync android

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK to repo root
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk

      - name: Commit and push APK to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git diff --cached --quiet || git commit -m "ci: update app-debug.apk [skip ci]"
          git push

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consultime-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
